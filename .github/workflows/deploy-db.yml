# NOT YET RUN. Promotes migrations: main -> staging automatically; production only by manual
# dispatch, gated by the "production" GitHub Environment (required reviewers).
name: Deploy database

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # db push applies migrations only. seed.sql is never run against staging or production.
      - run: supabase db push
      - run: supabase functions deploy
