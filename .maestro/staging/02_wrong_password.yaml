appId: app.dynorex.staging
name: Wrong password shows the spec copy and no account details
---
- launchApp:
    clearState: true
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: "definitely-wrong-1A"
- tapOn: "Sign in"
- assertVisible: "Wrong password"
